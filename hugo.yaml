baseURL: https://vicphd.github.io
languageCode: en-us
title: Vic
# Use Hugo modules to add theme
module:
  imports:
  - path: github.com/hugo-toha/toha/v4



languages:
  fr:
    languageName: Français
    weight: 1
  en:
    languageName: English
    weight: 2


params:
  background: "images/wallpaper.jpg"
  features:
    portfolio:
      enable: true
    blog:
      enable: true
    toc:
      enable: true
    darkMode:
      enable: true
# Configure footer
  footer:
    # enable: true
    newsletter:
      enable: false