baseURL: https://vicphd.github.io
languageCode: fr
defaultContentLanguage: fr


title: VIEW (Vic Innovation Example Website)
# Use Hugo modules to add theme
module:
  imports:
  - path: github.com/hugo-toha/toha/v4



languages:
  fr:
    languageName: Français
    weight: 1
  en:
    languageName: English
    weight: 2


params:
  background: "images/wallpaper.jpg"
  features:
    portfolio:
      enable: true
    blog:
      enable: true
    toc:
      enable: true
    darkMode:
      enable: false
# Configure footer
  footer:
    # enable: true
    newsletter:
      enable: false
  logo:
    main: images/logo.png
    inverted: images/logo.png
    favicon: images/logo.png

markup:
  goldmark:
    renderer:
      unsafe: true