baseURL: https://vicphd.github.io
languageCode: en-us
title: Vic
# Use Hugo modules to add theme
module:
  imports:
  - path: github.com/hugo-toha/toha/v4



languages:
  fr:
    languageName: Français
    weight: 1
  en:
    languageName: English
    weight: 2


params:
  features:
    # Enable portfolio section
    portfolio:
      enable: true

    # Enable blog posts
    blog:
      enable: true

    # Enable Table of contents in reading page
    toc:
      enable: true
# Configure footer
  footer:
    # enable: true
    newsletter:
      enable: false